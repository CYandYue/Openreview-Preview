name: Offline preview checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: python3 build_standalone.py
      - run: git -C .. diff --exit-code -- OpenReview-standalone.html
      - run: npm test
